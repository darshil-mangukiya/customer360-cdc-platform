name: protected-snowflake-validation

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: Run dbt build and snapshots against the configured environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    environment: snowflake-test
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - name: Connection and parse
        run: |
          dbt debug --project-dir dbt --profiles-dir dbt --target snowflake
          dbt parse --project-dir dbt --profiles-dir dbt --target snowflake
      - name: Protected build
        if: ${{ inputs.run_build }}
        run: |
          dbt run --project-dir dbt --profiles-dir dbt --target snowflake
          dbt snapshot --project-dir dbt --profiles-dir dbt --target snowflake
          dbt test --project-dir dbt --profiles-dir dbt --target snowflake

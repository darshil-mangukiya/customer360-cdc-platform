name: customer-360-platform-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: customer-360-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python and API security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install pip-audit==2.10.1
      - name: Dependency consistency
        run: python -m pip check
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q api customer360 contracts data_generation identity_resolution ingestion migration observability privacy reverse_etl scripts source_systems streaming validation tests
      - name: Prepare deterministic test fixtures
        run: make smoke
      - name: Full Python suite
        run: pytest -q
      - name: Focused authorization and privacy boundary
        run: pytest -q tests/test_api_authorization.py tests/test_activation_uat.py tests/test_consent_history.py

  contracts-and-pipeline:
    name: CDC contracts and local pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make smoke
      - run: make contract-gate
      - run: make drift
      - run: make validate
      - run: make gx-validate
      - run: make scorecard
      - run: make e2e-report
      - run: make benchmark
      - run: make incidents
      - run: make reconcile
      - run: python scripts/verify_activation_privacy.py

  warehouse-sql-docs:
    name: dbt, SQL, and documentation
    runs-on: ubuntu-latest
    env:
      # Non-secret GitHub context values satisfy dbt profile parsing only. This job
      # never opens a connection; live validation is in the separate protected workflow.
      SNOWFLAKE_ACCOUNT: ${{ github.repository_owner }}
      SNOWFLAKE_USER: ${{ github.actor }}
      SNOWFLAKE_PASSWORD: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: PostgreSQL dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt --target dev
      - name: Snowflake offline dbt parse
        run: dbt parse --project-dir dbt --profiles-dir dbt --target snowflake
      - run: make sql-lint
      - run: make docs-check
      - name: Local Markdown links
        run: python scripts/validate_local_links.py

  repository-hygiene:
    name: Repository and Compose hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed credential-bearing files
        shell: bash
        run: |
          test -z "$(git ls-files '.env' '*.pem' '*.p8' 'id_rsa' 'id_ed25519')"
          private_key_marker='-----BEGIN PRIVATE'' KEY-----'
          rsa_key_marker='-----BEGIN RSA PRIVATE'' KEY-----'
          ! git grep -I -n --fixed-strings -- "$private_key_marker"
          ! git grep -I -n --fixed-strings -- "$rsa_key_marker"
      - name: Validate Docker Compose
        run: docker compose config --quiet

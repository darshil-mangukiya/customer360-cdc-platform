# Local-only Docker Compose stack. Credentials are intentionally simple demo
# defaults and must be replaced before any non-local deployment.
services:
  postgres:
    image: postgres:16
    container_name: c360_postgres
    environment:
      POSTGRES_USER: c360
      POSTGRES_PASSWORD: c360
      POSTGRES_DB: c360
    ports:
      - "${WAREHOUSE_PORT:-5432}:5432"
    volumes:
      - c360_postgres_data:/var/lib/postgresql/data
      - ./warehouse/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c360 -d c360"]
      interval: 10s
      timeout: 5s
      retries: 5

  source_postgres:
    image: postgres:16
    container_name: customer-operational-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_USER: c360
      POSTGRES_PASSWORD: c360
      POSTGRES_DB: customer_ops
    ports:
      - "${SOURCE_PORT:-5433}:5432"
    volumes:
      - customer_ops_data:/var/lib/postgresql/data
      - ./source_systems/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c360 -d customer_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: c360_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: c360_kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_INTERNAL_HOST_PORT:-9092}:9092"
      - "${KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: c360_kafka_connect
    depends_on:
      kafka:
        condition: service_started
      source_postgres:
        condition: service_healthy
    ports:
      - "${CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: customer360-connect
      CONFIG_STORAGE_TOPIC: customer360_connect_configs
      OFFSET_STORAGE_TOPIC: customer360_connect_offsets
      STATUS_STORAGE_TOPIC: customer360_connect_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
    volumes:
      - ./connect:/opt/customer-360-cdc-platform/connect:ro

  ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingestion
    container_name: c360_ingestion
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      WAREHOUSE_DSN: postgresql://c360:c360@postgres:5432/c360
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./:/opt/customer-360-cdc-platform
    command: ["python3", "scripts/run_postgres_pipeline.py", "--dsn", "postgresql://c360:c360@postgres:5432/c360", "--skip-dbt"]

  dbt:
    build:
      context: .
      dockerfile: docker/Dockerfile.dbt
    container_name: c360_dbt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: c360
      POSTGRES_USER: c360
      POSTGRES_PASSWORD: c360
    volumes:
      - ./:/opt/customer-360-cdc-platform
    working_dir: /opt/customer-360-cdc-platform/dbt
    command: ["dbt", "run", "--profiles-dir", "."]

  activation_api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: c360_activation_api
    depends_on:
      - ingestion
    environment:
      ACTIVATION_EXPORT_DIR: /opt/customer-360-cdc-platform/reverse_etl/exports
      ACTIVATION_API_KEY: local-dev-key # Local-only demo value; do not reuse in production.
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./:/opt/customer-360-cdc-platform

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: c360_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://c360:c360@postgres:5432/c360
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      CUSTOMER360_PROJECT_DIR: /opt/customer-360-cdc-platform
      CUSTOMER360_PYTHON: python3
      CUSTOMER360_CONTRACT_CANDIDATE: ${CUSTOMER360_CONTRACT_CANDIDATE:-contracts/cdc_payload_contracts.json}
      WAREHOUSE_DSN: postgresql://c360:c360@postgres:5432/c360
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./:/opt/customer-360-cdc-platform
      - ./airflow/dags:/opt/airflow/dags
    command: ["airflow", "webserver"]

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: c360_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://c360:c360@postgres:5432/c360
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      CUSTOMER360_PROJECT_DIR: /opt/customer-360-cdc-platform
      CUSTOMER360_PYTHON: python3
      CUSTOMER360_CONTRACT_CANDIDATE: ${CUSTOMER360_CONTRACT_CANDIDATE:-contracts/cdc_payload_contracts.json}
      WAREHOUSE_DSN: postgresql://c360:c360@postgres:5432/c360
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./:/opt/customer-360-cdc-platform
      - ./airflow/dags:/opt/airflow/dags
    command: ["airflow", "scheduler"]

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: c360_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://c360:c360@postgres:5432/c360
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      CUSTOMER360_PROJECT_DIR: /opt/customer-360-cdc-platform
      CUSTOMER360_PYTHON: python3
    volumes:
      - ./:/opt/customer-360-cdc-platform
      - ./airflow/dags:/opt/airflow/dags
    command:
      - bash
      - -c
      # Local-only demo administrator; replace before deployment.
      - airflow db migrate && (airflow users create --username admin --password admin --firstname Data --lastname Platform --role Admin --email admin@example.com || true)

volumes:
  c360_postgres_data:
  customer_ops_data:
